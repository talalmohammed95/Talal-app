name: Check build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ADMIN_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and set up the database
        run: npm run build
      - name: Build again (setup is safe to repeat)
        run: npm run build
      - name: Starting offers are not published in the page
        run: "! grep -q 'p3-studio-410' dist/app/index.html"
      - name: App script parses
        run: |
          node -e '
            const h=require("fs").readFileSync("dist/app/index.html","utf8");
            const s=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join("\n");
            new Function(s); console.log("script OK");'
      - name: API answers
        run: |
          (npm run -s dev &) ; sleep 3
          curl -sf http://localhost:3000/api/auth/config
          curl -sf http://localhost:3000/ | grep -q 'Peninsula'
          curl -sf http://localhost:3000/app/ | grep -q 'gate'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/data/all)" = 401
